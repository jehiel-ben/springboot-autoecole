# ================== Application ==================
spring.application.name=auto-ecole
server.port=8080

# ================== DataSource MySQL ==================
spring.datasource.url=jdbc:mysql://localhost:3306/auto_ecole_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================== JPA / Hibernate ==================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ================== Logs ==================
logging.level.org.hibernate.SQL=DEBUG

# Upload de fichiers
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Dossier de stockage des photos (hors du projet)
app.upload.dir=uploads

# Accepter les connexions externes (pour mobile)
server.address=0.0.0.0