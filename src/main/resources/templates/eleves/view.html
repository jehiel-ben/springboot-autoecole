<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>

<div th:replace="~{layout :: sidebar}"></div>

<div class="main-content">
    <div th:replace="~{layout :: topbar}"></div>

    <div class="page-content">

        <div class="page-header">
            <h1>
                <i class="bi bi-person-vcard-fill"></i>
                <span th:text="${eleve.prenom} + ' ' + ${eleve.nom}">Nom</span>
            </h1>
            <div>
                <a th:href="@{/eleves/modifier/{id}(id=${eleve.id})}" class="btn btn-warning">
                    <i class="bi bi-pencil"></i> Modifier
                </a>
                <a th:href="@{/eleves}" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> Retour
                </a>
            </div>
        </div>

        <div class="row g-3">
            <div class="col-md-6">
                <div class="table-container p-4">
                    <h5 class="mb-3 text-primary"><i class="bi bi-info-circle"></i> Informations personnelles</h5>

                    <dl class="row mb-0">
                        <dt class="col-sm-4 text-muted">Nom</dt>
                        <dd class="col-sm-8" th:text="${eleve.nom}">Nom</dd>

                        <dt class="col-sm-4 text-muted">Prénom</dt>
                        <dd class="col-sm-8" th:text="${eleve.prenom}">Prénom</dd>

                        <dt class="col-sm-4 text-muted">Email</dt>
                        <dd class="col-sm-8" th:text="${eleve.email}">Email</dd>

                        <dt class="col-sm-4 text-muted">Téléphone</dt>
                        <dd class="col-sm-8" th:text="${eleve.telephone} ?: '—'">Tél</dd>

                        <dt class="col-sm-4 text-muted">Date naissance</dt>
                        <dd class="col-sm-8"
                            th:text="${eleve.dateNaissance} != null ? ${#temporals.format(eleve.dateNaissance, 'dd/MM/yyyy')} : '—'">
                            Date
                        </dd>

                        <dt class="col-sm-4 text-muted">Inscription</dt>
                        <dd class="col-sm-8"
                            th:text="${eleve.dateInscription} != null ? ${#temporals.format(eleve.dateInscription, 'dd/MM/yyyy')} : '—'">
                            Date
                        </dd>

                        <dt class="col-sm-4 text-muted">Statut</dt>
                        <dd class="col-sm-8">
                            <span class="badge"
                                  th:classappend="${eleve.statut == 'ACTIF'} ? 'badge-actif' : 'badge-inactif'"
                                  th:text="${eleve.statut}">ACTIF</span>
                        </dd>
                    </dl>
                </div>
            </div>

            <div class="col-md-6">
                <div class="table-container p-4">
                    <h5 class="mb-3 text-primary"><i class="bi bi-clock-history"></i> Activité</h5>
                    <p class="text-muted">
                        Le détail des séances et paiements est disponible dans les sections correspondantes.
                    </p>
                    <a th:href="@{/seances}" class="btn btn-sm btn-outline-primary">
                        <i class="bi bi-calendar"></i> Voir les séances
                    </a>
                    <a th:href="@{/paiements}" class="btn btn-sm btn-outline-primary">
                        <i class="bi bi-cash"></i> Voir les paiements
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{layout :: scripts-fin}"></th:block>
</body>
</html>
