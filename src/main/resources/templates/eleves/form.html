<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>

<div th:replace="~{layout :: sidebar}"></div>

<div class="main-content">
    <div th:replace="~{layout :: topbar}"></div>

    <div class="page-content">

        <div th:if="${error}" class="alert alert-danger">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${error}"></span>
        </div>

        <div class="page-header">
            <h1>
                <i class="bi" th:classappend="${isEdit} ? 'bi-pencil-square' : 'bi-person-plus-fill'"></i>
                <span th:text="${isEdit} ? 'Modifier un élève' : 'Nouvel élève'">Formulaire</span>
            </h1>
            <a th:href="@{/eleves}" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Retour
            </a>
        </div>

        <div class="table-container p-4">
            <form th:action="${isEdit} ? @{/eleves/modifier/{id}(id=${eleveId})} : @{/eleves/nouveau}"
                  th:object="${eleve}"
                  method="post">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Nom <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{nom}" class="form-control" required maxlength="80">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Prénom <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{prenom}" class="form-control" required maxlength="80">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email <span class="text-danger">*</span></label>
                        <input type="email" th:field="*{email}" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Téléphone</label>
                        <input type="text" th:field="*{telephone}" class="form-control" maxlength="20">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Date de naissance</label>
                        <input type="date" th:field="*{dateNaissance}" class="form-control">
                    </div>
                </div>

                <hr class="my-4">

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/eleves}" class="btn btn-secondary">
                        <i class="bi bi-x-lg"></i> Annuler
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg"></i>
                        <span th:text="${isEdit} ? 'Enregistrer' : 'Créer'">Enregistrer</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<th:block th:replace="~{layout :: scripts-fin}"></th:block>
</body>
</html>
