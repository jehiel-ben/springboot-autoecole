<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>

<div th:replace="~{layout :: sidebar}"></div>

<div class="main-content">
    <div th:replace="~{layout :: topbar}"></div>

    <div class="page-content">

        <div th:if="${error}" class="alert alert-danger">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${error}"></span>
        </div>

        <div class="page-header">
            <h1>
                <i class="bi bi-cash-stack"></i> Nouveau paiement
            </h1>
            <a th:href="@{/paiements}" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Retour
            </a>
        </div>

        <div class="table-container p-4">
            <form th:action="@{/paiements/nouveau}" th:object="${paiement}" method="post">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Élève <span class="text-danger">*</span></label>
                        <select th:field="*{eleveId}" class="form-select" required>
                            <option value="">— Choisir un élève —</option>
                            <option th:each="e : ${eleves}"
                                    th:value="${e.id}"
                                    th:text="${e.prenom} + ' ' + ${e.nom} + ' (' + ${e.email} + ')'">
                                Élève
                            </option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Date de paiement <span class="text-danger">*</span></label>
                        <input type="date" th:field="*{datePaiement}" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Montant (FBU) <span class="text-danger">*</span></label>
                        <input type="number" step="0.01" min="0.01"
                               th:field="*{montant}" class="form-control" required placeholder="950.00">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Mode de paiement <span class="text-danger">*</span></label>
                        <select th:field="*{modePaiement}" class="form-select" required>
                            <option value="">— Choisir —</option>
                            <option value="ESPECES">Espèces</option>
                            <option value="CARTE">Carte bancaire</option>
                            <option value="VIREMENT">Virement</option>
                            <option value="CHEQUE">Chèque</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Type de formule <span class="text-danger">*</span></label>
                        <select th:field="*{typeFormule}" class="form-select" required>
                            <option value="">— Choisir —</option>
                            <option value="CODE_SEUL">Code seul</option>
                            <option value="CONDUITE_SEULE">Conduite seule</option>
                            <option value="FORMULE_COMPLETE">Formule complète</option>
                        </select>
                    </div>
                </div>

                <hr class="my-4">

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/paiements}" class="btn btn-secondary">
                        <i class="bi bi-x-lg"></i> Annuler
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg"></i> Enregistrer le paiement
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
