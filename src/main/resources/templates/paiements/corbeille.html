<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>

<div th:replace="~{layout :: sidebar}"></div>

<div class="main-content">
    <div th:replace="~{layout :: topbar}"></div>

    <div class="page-content">

        <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="page-header">
            <h1>
                <i class="bi bi-trash3"></i> Corbeille — Paiements
                <span class="badge bg-danger" th:text="${paiements.size()}">0</span>
            </h1>
            <a th:href="@{/paiements}" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Retour aux paiements
            </a>
        </div>

        <div class="table-container">
            <table class="table align-middle">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Date</th>
                    <th>Élève</th>
                    <th>Mode</th>
                    <th class="text-end">Montant</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${paiements.isEmpty()}">
                    <td colspan="6" class="text-center py-5 text-muted">
                        <i class="bi bi-emoji-smile fs-1 d-block mb-2"></i>
                        La corbeille est vide. Rien à restaurer.
                    </td>
                </tr>
                <tr th:each="p, iter : ${paiements}">
                    <td th:text="${iter.count}">1</td>
                    <td th:text="${#temporals.format(p.datePaiement, 'dd/MM/yyyy')}">Date</td>
                    <td th:text="${p.eleveNomComplet}">Élève</td>
                    <td th:text="${p.modePaiement}">Mode</td>
                    <td class="text-end fw-bold text-success"
                        th:text="${p.montant} + ' FBU'">0 FBU</td>
                    <td class="text-end">
                        <form th:action="@{/paiements/restaurer/{id}(id=${p.id})}"
                              method="post" class="d-inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-sm btn-success btn-icon" title="Restaurer">
                                <i class="bi bi-arrow-counterclockwise"></i>
                            </button>
                        </form>
                        <form th:action="@{/paiements/purger/{id}(id=${p.id})}"
                              method="post" class="d-inline"
                              onsubmit="return confirm('ATTENTION : Supprimer DÉFINITIVEMENT ce paiement ?');">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-sm btn-danger btn-icon" title="Supprimer définitivement">
                                <i class="bi bi-x-octagon"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
