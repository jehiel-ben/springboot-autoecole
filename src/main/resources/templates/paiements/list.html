<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>

<div th:replace="~{layout :: sidebar}"></div>

<div class="main-content">
    <div th:replace="~{layout :: topbar}"></div>

    <div class="page-content">

        <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="page-header">
            <h1>
                <i class="bi bi-cash-coin"></i> Paiements
                <span class="badge bg-primary" th:text="${paiements.size()}">0</span>
            </h1>
            <div>
                <a th:href="@{/paiements/corbeille}" class="btn btn-outline-danger">
                    <i class="bi bi-trash3"></i> Corbeille
                </a>
                <a th:href="@{/paiements/nouveau}" class="btn btn-primary">
                    <i class="bi bi-plus-lg"></i> Nouveau paiement
                </a>
            </div>
        </div>

        <!-- Carte total -->
        <div class="stat-card mb-4">
            <div>
                <p class="stat-value" th:text="${total} + ' FBU'">0 FBU</p>
                <p class="stat-label">Total encaissé</p>
            </div>
            <i class="bi bi-graph-up-arrow stat-icon"></i>
        </div>

        <div class="table-container">
            <table class="table align-middle">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Date</th>
                    <th>Élève</th>
                    <th>Formule</th>
                    <th>Mode</th>
                    <th class="text-end">Montant</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${paiements.isEmpty()}">
                    <td colspan="7" class="text-center py-5 text-muted">
                        <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                        Aucun paiement enregistré.
                    </td>
                </tr>
                <tr th:each="p, iter : ${paiements}">
                    <td th:text="${iter.count}">1</td>
                    <td th:text="${#temporals.format(p.datePaiement, 'dd/MM/yyyy')}">Date</td>
                    <td th:text="${p.eleveNomComplet}">Élève</td>
                    <td>
                        <span class="badge bg-secondary" th:text="${p.typeFormule}">Formule</span>
                    </td>
                    <td th:text="${p.modePaiement}">Mode</td>
                    <td class="text-end fw-bold text-success"
                        th:text="${p.montant} + ' €'">0 €</td>
                    <td class="text-end">
                        <a th:href="@{/paiements/recu/{id}(id=${p.id})}"
                           class="btn btn-sm btn-info btn-icon" title="Voir le reçu">
                            <i class="bi bi-receipt"></i>
                        </a>
                        <form th:action="@{/paiements/supprimer/{id}(id=${p.id})}"
                              method="post" class="d-inline"
                              onsubmit="return confirm('Mettre ce paiement à la corbeille ?');">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-sm btn-danger btn-icon" title="Mettre à la corbeille">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
