<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-École Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- ============ SIDEBAR (menu vertical à gauche) ============ -->
<aside th:fragment="sidebar" class="sidebar">
    <div class="sidebar-brand">
        <i class="bi bi-car-front-fill"></i>
        <span>Auto-École</span>
    </div>

    <nav class="sidebar-nav">
        <div class="sidebar-section">PRINCIPAL</div>

        <a th:href="@{/dashboard}" class="sidebar-link">
            <i class="bi bi-speedometer2"></i> Tableau de bord
        </a>

        <div class="sidebar-section">GESTION</div>

        <a th:href="@{/eleves}" class="sidebar-link">
            <i class="bi bi-people-fill"></i> Élèves
        </a>
        <a th:href="@{/moniteurs}" class="sidebar-link">
            <i class="bi bi-person-badge-fill"></i> Moniteurs
        </a>
        <a th:href="@{/vehicules}" class="sidebar-link">
            <i class="bi bi-truck"></i> Véhicules
        </a>

        <div class="sidebar-section">FORMATION</div>

        <a th:href="@{/seances}" class="sidebar-link">
            <i class="bi bi-calendar-event-fill"></i> Séances
        </a>
        <a th:href="@{/paiements}" class="sidebar-link">
            <i class="bi bi-cash-coin"></i> Paiements
        </a>
        <div class="sidebar-section">SYSTÈME</div>

        <a th:href="@{/eleves/corbeille}" class="sidebar-link">
            <i class="bi bi-trash3"></i> Corbeille
        </a>

    </nav>
</aside>

<!-- ============ TOP BAR ============ -->
<header th:fragment="topbar" class="topbar">
    <div class="topbar-left">
        <button class="hamburger-btn" id="hamburgerBtn" type="button" aria-label="Menu">
            <i class="bi bi-list"></i>
        </button>
        <span class="ms-2 fw-bold">Auto-École</span>
    </div>
    <div class="topbar-right">
        <div class="dropdown">
    <a class="user-menu dropdown-toggle" href="#" data-bs-toggle="dropdown">
        <img th:if="${utilisateurConnecte != null && utilisateurConnecte.photoUrl != null}"
            th:src="@{${utilisateurConnecte.photoUrl}}"
            alt="Photo" class="user-avatar">
        <i th:if="${utilisateurConnecte == null || utilisateurConnecte.photoUrl == null}"
           class="bi bi-person-circle"></i>
        <span th:text="${utilisateurConnecte != null && utilisateurConnecte.nomComplet != null 
                        ? utilisateurConnecte.nomComplet 
                        : #authentication.name}">Utilisateur</span>
        <span class="badge bg-primary ms-2">Administrateur</span>
    </a>
    <ul class="dropdown-menu dropdown-menu-end">
        <li>
            <a th:href="@{/profil}" class="dropdown-item">
                <i class="bi bi-person-gear"></i> Mon profil
            </a>
        </li>
        <li><hr class="dropdown-divider"></li>
        <li>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="dropdown-item">
                    <i class="bi bi-box-arrow-right"></i> Déconnexion
                </button>
            </form>
        </li>
    </ul>
</div>
    </div>
</header>

<!-- ============ SCRIPTS ============ -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</th:block>

<!-- ============ OVERLAY + JS HAMBURGER (fragment) ============ -->
<th:block th:fragment="scripts-fin">
    <!-- Overlay pour fermer la sidebar sur mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <script>
        window.addEventListener('DOMContentLoaded', function () {
            const hamburger = document.getElementById('hamburgerBtn');
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.getElementById('sidebarOverlay');

            console.log('Hamburger:', hamburger);
            console.log('Sidebar:', sidebar);
            console.log('Overlay:', overlay);

            if (!hamburger || !sidebar || !overlay) {
                console.warn('Un élément est manquant dans le DOM');
                return;
            }

            hamburger.addEventListener('click', function () {
                sidebar.classList.toggle('show');
                overlay.classList.toggle('show');
            });

            overlay.addEventListener('click', function () {
                sidebar.classList.remove('show');
                overlay.classList.remove('show');
            });

            sidebar.querySelectorAll('.sidebar-link').forEach(function (link) {
                link.addEventListener('click', function () {
                    if (window.innerWidth <= 768) {
                        sidebar.classList.remove('show');
                        overlay.classList.remove('show');
                    }
                });
            });
        });
    </script>
</th:block>
</body>
</html>
