<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>

<div th:replace="~{layout :: sidebar}"></div>

<div class="main-content">
    <div th:replace="~{layout :: topbar}"></div>

    <div class="page-content">

        <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="page-header">
            <h1>
                <i class="bi bi-person-badge-fill"></i> Moniteurs
                <span class="badge bg-primary" th:text="${moniteurs.size()}">0</span>
            </h1>
            <div>
                <a th:href="@{/moniteurs/corbeille}" class="btn btn-outline-danger">
                    <i class="bi bi-trash3"></i> Corbeille
                </a>
                <a th:href="@{/moniteurs/nouveau}" class="btn btn-primary">
                    <i class="bi bi-plus-lg"></i> Nouveau moniteur
                </a>
            </div>
        </div>

        <div class="table-container">
            <table class="table align-middle">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Nom complet</th>
                    <th>Numéro permis</th>
                    <th>Téléphone</th>
                    <th>Email</th>
                    <th>Disponibilité</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${moniteurs.isEmpty()}">
                    <td colspan="7" class="text-center py-5 text-muted">
                        <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                        Aucun moniteur enregistré.
                    </td>
                </tr>
                <tr th:each="m, iter : ${moniteurs}">
                    <td th:text="${iter.count}">1</td>
                    <td>
                        <a th:href="@{/moniteurs/voir/{id}(id=${m.id})}"
                           class="text-decoration-none fw-bold"
                           th:text="${m.prenom} + ' ' + ${m.nom}">Nom</a>
                    </td>
                    <td><code th:text="${m.numPermis}">ABC</code></td>
                    <td th:text="${m.telephone} ?: '—'">Tel</td>
                    <td th:text="${m.email} ?: '—'">Email</td>
                    <td>
                        <span th:if="${m.statutDispo}" class="badge badge-disponible">Disponible</span>
                        <span th:if="${!m.statutDispo}" class="badge badge-inactif">Indisponible</span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{/moniteurs/voir/{id}(id=${m.id})}"
                           class="btn btn-sm btn-info btn-icon" title="Voir">
                            <i class="bi bi-eye"></i>
                        </a>
                        <a th:href="@{/moniteurs/modifier/{id}(id=${m.id})}"
                           class="btn btn-sm btn-warning btn-icon" title="Modifier">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form th:action="@{/moniteurs/supprimer/{id}(id=${m.id})}"
                              method="post" class="d-inline"
                              onsubmit="return confirm('Mettre ce moniteur à la corbeille ?');">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-sm btn-danger btn-icon" title="Mettre à la corbeille">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
