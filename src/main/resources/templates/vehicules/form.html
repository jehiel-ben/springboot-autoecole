<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>

<div th:replace="~{layout :: sidebar}"></div>

<div class="main-content">
    <div th:replace="~{layout :: topbar}"></div>

    <div class="page-content">

        <div th:if="${error}" class="alert alert-danger">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${error}"></span>
        </div>

        <div class="page-header">
            <h1>
                <i class="bi" th:classappend="${isEdit} ? 'bi-pencil-square' : 'bi-plus-circle-fill'"></i>
                <span th:text="${isEdit} ? 'Modifier un véhicule' : 'Nouveau véhicule'">Formulaire</span>
            </h1>
            <a th:href="@{/vehicules}" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Retour
            </a>
        </div>

        <div class="table-container p-4">
            <form th:action="${isEdit} ? @{/vehicules/modifier/{id}(id=${vehiculeId})} : @{/vehicules/nouveau}"
                  th:object="${vehicule}"
                  method="post">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Immatriculation <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{immatriculation}" class="form-control" required maxlength="20" placeholder="AB-123-CD">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Marque <span class="text-danger">*</span></label>
                        <input type="text" th:field="*{marque}" class="form-control" required maxlength="50">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Modèle</label>
                        <input type="text" th:field="*{modele}" class="form-control" maxlength="50">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Type de boîte</label>
                        <select th:field="*{typeBoite}" class="form-select">
                            <option value="">— Choisir —</option>
                            <option value="MANUELLE">Manuelle</option>
                            <option value="AUTOMATIQUE">Automatique</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">État</label>
                        <select th:field="*{statutEntretiens}" class="form-select">
                            <option value="DISPONIBLE">Disponible</option>
                            <option value="EN_MAINTENANCE">En maintenance</option>
                            <option value="HORS_SERVICE">Hors service</option>
                        </select>
                    </div>
                </div>

                <hr class="my-4">

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/vehicules}" class="btn btn-secondary">
                        <i class="bi bi-x-lg"></i> Annuler
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg"></i>
                        <span th:text="${isEdit} ? 'Enregistrer' : 'Créer'">Enregistrer</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
