<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>

<div th:replace="~{layout :: sidebar}"></div>

<div class="main-content">
    <div th:replace="~{layout :: topbar}"></div>

    <div class="page-content">

        <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="page-header">
            <h1>
                <i class="bi bi-truck"></i> Véhicules
                <span class="badge bg-primary" th:text="${vehicules.size()}">0</span>
            </h1>
            <div>
                <a th:href="@{/vehicules/corbeille}" class="btn btn-outline-danger">
                    <i class="bi bi-trash3"></i> Corbeille
                </a>
                <a th:href="@{/vehicules/nouveau}" class="btn btn-primary">
                    <i class="bi bi-plus-lg"></i> Nouveau véhicule
                </a>
            </div>
        </div>

        <div class="table-container">
            <table class="table align-middle">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Immatriculation</th>
                    <th>Marque / Modèle</th>
                    <th>Boîte</th>
                    <th>État</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${vehicules.isEmpty()}">
                    <td colspan="6" class="text-center py-5 text-muted">
                        <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                        Aucun véhicule enregistré.
                    </td>
                </tr>
                <tr th:each="v, iter : ${vehicules}">
                    <td th:text="${iter.count}">1</td>
                    <td>
                        <a th:href="@{/vehicules/voir/{id}(id=${v.id})}"
                           class="text-decoration-none fw-bold"
                           th:text="${v.immatriculation}">AB-123-CD</a>
                    </td>
                    <td>
                        <span th:text="${v.marque}">Marque</span>
                        <small class="text-muted d-block" th:text="${v.modele}">Modèle</small>
                    </td>
                    <td th:text="${v.typeBoite} ?: '—'">MANUELLE</td>
                    <td>
                        <span class="badge"
                              th:classappend="
                                ${v.statutEntretiens == 'DISPONIBLE'} ? 'badge-disponible' :
                                (${v.statutEntretiens == 'EN_MAINTENANCE'} ? 'badge-maintenance' : 'badge-hors-service')"
                              th:text="${v.statutEntretiens}">DISPONIBLE</span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{/vehicules/voir/{id}(id=${v.id})}"
                           class="btn btn-sm btn-info btn-icon" title="Voir">
                            <i class="bi bi-eye"></i>
                        </a>
                        <a th:href="@{/vehicules/modifier/{id}(id=${v.id})}"
                           class="btn btn-sm btn-warning btn-icon" title="Modifier">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form th:action="@{/vehicules/supprimer/{id}(id=${v.id})}"
                              method="post" class="d-inline"
                              onsubmit="return confirm('Mettre ce véhicule à la corbeille ?');">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-sm btn-danger btn-icon" title="Mettre à la corbeille">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
