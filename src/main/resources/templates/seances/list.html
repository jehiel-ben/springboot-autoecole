<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>

<div th:replace="~{layout :: sidebar}"></div>

<div class="main-content">
    <div th:replace="~{layout :: topbar}"></div>

    <div class="page-content">

        <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="page-header">
            <h1>
                <i class="bi bi-calendar-event-fill"></i> Séances
                <span class="badge bg-primary" th:text="${seances.size()}">0</span>
            </h1>
            <div>
                <a th:href="@{/seances/corbeille}" class="btn btn-outline-danger">
                    <i class="bi bi-trash3"></i> Corbeille
                </a>
                <a th:href="@{/seances/nouveau}" class="btn btn-primary">
                    <i class="bi bi-plus-lg"></i> Nouvelle séance
                </a>
            </div>
        </div>

        <div class="table-container">
            <table class="table align-middle">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Date</th>
                    <th>Type</th>
                    <th>Élève</th>
                    <th>Moniteur</th>
                    <th>Véhicule</th>
                    <th>Statut</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${seances.isEmpty()}">
                    <td colspan="8" class="text-center py-5 text-muted">
                        <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                        Aucune séance planifiée.
                    </td>
                </tr>
                <tr th:each="s, iter : ${seances}">
                    <td th:text="${iter.count}">1</td>
                    <td>
                        <b th:text="${#temporals.format(s.dateHeureDebut, 'dd/MM/yyyy')}">Date</b>
                        <small class="text-muted d-block"
                               th:text="${#temporals.format(s.dateHeureDebut, 'HH:mm')} + ' → ' + ${#temporals.format(s.dateHeureFin, 'HH:mm')}">
                            Heure
                        </small>
                    </td>
                    <td>
                        <span class="badge"
                              th:classappend="${s.typeCours == 'CODE'} ? 'bg-secondary' : 'bg-primary'"
                              th:text="${s.typeCours}">CODE</span>
                    </td>
                    <td th:text="${s.eleveNomComplet}">Élève</td>
                    <td th:text="${s.moniteurNomComplet}">Moniteur</td>
                    <td th:text="${s.vehiculeImmatriculation} ?: '—'">Immat</td>
                    <td>
                        <span class="badge"
                              th:classappend="
                                ${s.statut == 'PLANIFIEE'} ? 'bg-primary' :
                                (${s.statut == 'EN_COURS'} ? 'bg-warning text-dark' :
                                (${s.statut == 'TERMINEE'} ? 'badge-disponible' : 'badge-inactif'))"
                              th:text="${s.statut}">PLANIFIEE</span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{/seances/voir/{id}(id=${s.id})}"
                           class="btn btn-sm btn-info btn-icon" title="Voir">
                            <i class="bi bi-eye"></i>
                        </a>
                        <form th:action="@{/seances/supprimer/{id}(id=${s.id})}"
                              method="post" class="d-inline"
                              onsubmit="return confirm('Mettre cette séance à la corbeille ?');">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-sm btn-danger btn-icon" title="Mettre à la corbeille">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
