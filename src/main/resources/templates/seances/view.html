<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>

<div th:replace="~{layout :: sidebar}"></div>

<div class="main-content">
    <div th:replace="~{layout :: topbar}"></div>

    <div class="page-content">

        <div class="page-header">
            <h1>
                <i class="bi bi-calendar-event-fill"></i>
                Séance du
                <span th:text="${#temporals.format(seance.dateHeureDebut, 'dd/MM/yyyy HH:mm')}">Date</span>
            </h1>
            <a th:href="@{/seances}" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Retour
            </a>
        </div>

        <div class="table-container p-4 mb-3">
            <h5 class="mb-3 text-primary"><i class="bi bi-gear-fill"></i> Changer le statut</h5>
            <form th:action="@{/seances/statut/{id}(id=${seance.id})}" method="post" class="d-flex gap-2">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <select name="statut" class="form-select" style="max-width: 250px;">
                    <option value="PLANIFIEE" th:selected="${seance.statut == 'PLANIFIEE'}">Planifiée</option>
                    <option value="EN_COURS" th:selected="${seance.statut == 'EN_COURS'}">En cours</option>
                    <option value="TERMINEE" th:selected="${seance.statut == 'TERMINEE'}">Terminée</option>
                    <option value="ANNULEE" th:selected="${seance.statut == 'ANNULEE'}">Annulée</option>
                </select>
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg"></i> Mettre à jour
                </button>
            </form>
        </div>

        <div class="table-container p-4">
            <dl class="row mb-0">
                <dt class="col-sm-3 text-muted">Date et heure</dt>
                <dd class="col-sm-9">
                    <b th:text="${#temporals.format(seance.dateHeureDebut, 'dd/MM/yyyy HH:mm')}">Début</b>
                    <span> → </span>
                    <b th:text="${#temporals.format(seance.dateHeureFin, 'dd/MM/yyyy HH:mm')}">Fin</b>
                </dd>

                <dt class="col-sm-3 text-muted">Type de cours</dt>
                <dd class="col-sm-9">
                    <span class="badge"
                          th:classappend="${seance.typeCours == 'CODE'} ? 'bg-secondary' : 'bg-primary'"
                          th:text="${seance.typeCours}">CODE</span>
                </dd>

                <dt class="col-sm-3 text-muted">Statut</dt>
                <dd class="col-sm-9">
                    <span class="badge bg-secondary" th:text="${seance.statut}">PLANIFIEE</span>
                </dd>

                <dt class="col-sm-3 text-muted">Élève</dt>
                <dd class="col-sm-9" th:text="${seance.eleveNomComplet}">Élève</dd>

                <dt class="col-sm-3 text-muted">Moniteur</dt>
                <dd class="col-sm-9" th:text="${seance.moniteurNomComplet}">Moniteur</dd>

                <dt class="col-sm-3 text-muted">Véhicule</dt>
                <dd class="col-sm-9">
                    <span th:if="${seance.vehiculeImmatriculation}"
                          th:text="${seance.vehiculeImmatriculation}">Immat</span>
                    <span th:unless="${seance.vehiculeImmatriculation}" class="text-muted">Aucun</span>
                </dd>
            </dl>
        </div>
    </div>
</div>

<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
