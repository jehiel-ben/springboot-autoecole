<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>

<div th:replace="~{layout :: sidebar}"></div>

<div class="main-content">
    <div th:replace="~{layout :: topbar}"></div>

    <div class="page-content">

        <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
            <i class="bi bi-check-circle-fill"></i>
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="page-header">
            <h1><i class="bi bi-person-gear"></i> Mon profil</h1>
        </div>

        <div class="row g-3">
            <div class="col-md-4">
                <div class="table-container p-4 text-center">
                    <div class="mb-3">
                        <img th:if="${utilisateur.photoUrl != null}"
                            th:src="@{${utilisateur.photoUrl}}"
                            alt="Photo de profil"
                            style="width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 4px solid #2563eb;">
                        <i th:if="${utilisateur.photoUrl == null}"
                           class="bi bi-person-circle"
                           style="font-size: 150px; color: #2563eb;"></i>
                    </div>
                    <h4 th:text="${utilisateur.nomComplet}">Nom</h4>
                    <p class="text-muted" th:text="${utilisateur.email}">email</p>
                    <span class="badge bg-primary">Administrateur</span>
                </div>
            </div>

            <div class="col-md-8">
                <div class="table-container p-4">
                    <h5 class="mb-3 text-primary"><i class="bi bi-pencil-square"></i> Modifier mes informations</h5>
                    <form th:action="@{/profil}" method="post" enctype="multipart/form-data">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Nom complet</label>
                                <input type="text" name="nomComplet" class="form-control"
                                       th:value="${utilisateur.nomComplet}" placeholder="M. Bahizire">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Email</label>
                                <input type="email" name="email" class="form-control"
                                       th:value="${utilisateur.email}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Nouveau mot de passe</label>
                                <input type="password" name="newPassword" class="form-control"
                                       placeholder="Laisser vide pour ne pas changer" minlength="6">
                                <small class="text-muted">Minimum 6 caractères</small>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Photo de profil</label>
                                <input type="file" name="photo" class="form-control" accept="image/*">
                                <small class="text-muted">Format JPG/PNG, max 5 MB</small>
                            </div>
                        </div>

                        <hr class="my-4">

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/dashboard}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Retour
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-lg"></i> Enregistrer
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{layout :: scripts}"></th:block>
</body>
</html>
